# Pipeline de testes do projeto VR (pasta VR/).
# Roda automaticamente em todo pull request que altere a pasta VR/ (ou este arquivo)
# e pode ser disparada manualmente pela aba Actions.
#
# Cada ferramenta roda em um job separado (com matrix para API e frontend), assim:
# - os testes executam em paralelo;
# - uma falha em uma ferramenta não interrompe as demais (fail-fast: false);
# - o PR mostra um check por projeto, facilitando identificar o que quebrou.
name: VR - Testes automatizados

on:
  pull_request:
    paths:
      - 'VR/**'
      - '.github/workflows/vr-tests.yml'
  workflow_dispatch:

# Um novo push no mesmo PR cancela a execução anterior, que ficou obsoleta.
concurrency:
  group: vr-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Ruby + Cucumber (api: HTTParty | web: Capybara + Selenium + SitePrism)
  # ---------------------------------------------------------------------------
  ruby:
    name: Ruby + Cucumber (${{ matrix.projeto }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        projeto: [api, web]
    defaults:
      run:
        working-directory: VR/${{ matrix.projeto }}
    steps:
      - uses: actions/checkout@v4

      # Ruby 2.7 = mesma versão usada no desenvolvimento. O Bundler 2.4 é a última linha
      # compatível com Ruby 2.7 e, ao contrário do 2.1 local, consegue adicionar a plataforma Linux.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler: '2.4.22'

      # O Gemfile.lock foi gerado no Windows (x64-mingw32); adiciona a plataforma do runner
      # para que gems nativas (nokogiri, ffi) sejam resolvidas para Linux.
      - name: Instalar dependências
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4

      - name: Executar testes
        run: bundle exec cucumber

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-ruby-${{ matrix.projeto }}
          path: VR/${{ matrix.projeto }}/reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Cypress e Playwright (JavaScript) — todos os projetos expõem "npm test"
  # ---------------------------------------------------------------------------
  node:
    name: ${{ matrix.projeto }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        projeto: [api-cypress, web-cypress, api-playwright, web-playwright]
    defaults:
      run:
        working-directory: VR/${{ matrix.projeto }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VR/${{ matrix.projeto }}/package-lock.json

      # "npm ci" instala exatamente as versões do package-lock.json.
      # Os testes web usam o Google Chrome que já vem instalado no runner do GitHub.
      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      # Junta as evidências que existirem (screenshots do Cypress, relatório do Playwright).
      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ matrix.projeto }}
          path: |
            VR/${{ matrix.projeto }}/cypress/screenshots/
            VR/${{ matrix.projeto }}/playwright-report/
            VR/${{ matrix.projeto }}/test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Robot Framework (api: RequestsLibrary | web: SeleniumLibrary)
  # ---------------------------------------------------------------------------
  robot:
    name: Robot Framework (${{ matrix.projeto }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        projeto: [api-robot, web-robot]
    defaults:
      run:
        working-directory: VR/${{ matrix.projeto }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: VR/${{ matrix.projeto }}/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar testes
        run: robot -d results tests

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ matrix.projeto }}
          path: VR/${{ matrix.projeto }}/results/
          if-no-files-found: ignore
